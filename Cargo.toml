[package]
name = "neuclidio"
version = "0.1.0"
authors = ["Linas Nikiperavičius <linas@linasdev.com>"]
edition = "2024"
description = "Non-euclidean geometry game engine"
repository = "https://github.com/linasdev/neuclidio"
readme = "README.md"
license = "MIT"

[dependencies]
log = "0.4.29"
bus = "2.4.1"

[dependencies.winit]
version = "0.30.12"

[dev-dependencies]
env_logger = "0.11.8"

[features]
default = []

[[example]]
name = "window_open"
path = "examples/window_open.rs"

[[example]]
name = "window_close"
path = "examples/window_close.rs"
